name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Installs the agent as a Windows service with deploy/windows/install.ps1,
  # then connects from Chromium through a relay to this runner's own Remote
  # Desktop, signing in with a Windows account.
  windows-rdp:
    name: windows (real Remote Desktop)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - name: Create a Windows account to sign in with
        shell: powershell
        run: |
          $pw = 'Wr1!' + [guid]::NewGuid().ToString('N').Substring(0, 20)
          Write-Host "::add-mask::$pw"
          New-LocalUser -Name wrhsrdp -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          "RDP_PASS=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install the agent service
        shell: powershell
        env:
          WRHS_PASSWORD: ci-wrhs-password-not-secret
        run: .\dist\windows\install.ps1 -RelayUrl http://127.0.0.1:8080 -User alice -RemoteDesktopUser wrhsrdp -LauncherOut "$env:RUNNER_TEMP\launcher.html"
      - name: Start a relay for the agent
        shell: powershell
        run: |
          node dist/agent/wrhs-agent.mjs registration --config C:\ProgramData\WRHS\agent.json | Out-File -Encoding ascii "$env:RUNNER_TEMP\agents.json"
          $env:RELAY_AGENTS_FILE = "$env:RUNNER_TEMP\agents.json"
          $env:RELAY_HOST = '127.0.0.1'
          $env:RELAY_PORT = '8080'
          Start-Process -FilePath node -ArgumentList 'packages/relay/src/main.ts' -WindowStyle Hidden `
            -RedirectStandardOutput "$env:RUNNER_TEMP\relay.log" -RedirectStandardError "$env:RUNNER_TEMP\relay-err.log"
          for ($i = 0; $i -lt 90; $i++) {
            if ((Test-Path "$env:RUNNER_TEMP\relay.log") -and (Select-String -Quiet -Path "$env:RUNNER_TEMP\relay.log" -Pattern 'agent-online')) { Write-Host 'Agent service is online.'; exit 0 }
            Start-Sleep -Seconds 1
          }
          Get-Content "$env:RUNNER_TEMP\relay.log", "$env:RUNNER_TEMP\relay-err.log" -ErrorAction SilentlyContinue
          Get-ChildItem C:\ProgramData\WRHS\logs | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 50 }
          throw 'The agent service did not connect to the relay.'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Open This PC from Chromium through the relay
        env:
          WRHS_LAUNCHER: ${{ runner.temp }}\launcher.html
          WRHS_CONFIG: C:\ProgramData\WRHS\agent.json
          WRHS_USER: alice
          WRHS_PASSWORD: ci-wrhs-password-not-secret
          RDP_USER: wrhsrdp
          SCREENSHOT_DIR: ${{ runner.temp }}
        run: node test/windows/rdp-integration.ts
      - name: Collect logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\logs" | Out-Null
          Copy-Item -ErrorAction SilentlyContinue C:\ProgramData\WRHS\logs\* "$env:RUNNER_TEMP\logs"
          Copy-Item -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\relay*.log", "$env:RUNNER_TEMP\*.png" "$env:RUNNER_TEMP\logs"
          Get-ChildItem "$env:RUNNER_TEMP\logs" | ForEach-Object { Write-Host "--- $($_.Name)"; if ($_.Extension -eq '.log') { Get-Content $_.FullName -Tail 40 } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-rdp
          path: ${{ runner.temp }}/logs
      - name: Uninstall the agent service
        shell: powershell
        run: |
          .\dist\windows\uninstall.ps1 -RemoveData
          if (Get-Service -Name WRHSAgent -ErrorAction SilentlyContinue) { throw 'The service is still installed.' }
          if (Get-NetFirewallRule -Name 'WRHS-*' -ErrorAction SilentlyContinue) { throw 'Firewall rules are left behind.' }
