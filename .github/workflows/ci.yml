name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Installs the agent as a Windows service with deploy/windows/install.ps1,
  # then connects from Chromium through a relay to this runner's own Remote
  # Desktop, signing in with a Windows account.
  windows-rdp:
    name: windows (real Remote Desktop)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - name: Create a Windows account to sign in with
        shell: powershell
        run: |
          $pw = 'Wr1!' + [guid]::NewGuid().ToString('N').Substring(0, 20)
          Write-Host "::add-mask::$pw"
          New-LocalUser -Name wrhsrdp -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          "RDP_PASS=$pw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: The installer does not cut off someone using Remote Desktop over the network
        shell: powershell
        run: |
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Start-Service TermService
          # A connection to this runner's own network address counts as one from the network.
          $ip = (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '127.*' -and $_.IPAddress -notlike '169.254.*' } | Select-Object -First 1).IPAddress
          $tcp = $null
          for ($i = 0; -not $tcp -and $i -lt 30; $i++) {
            try { $tcp = New-Object Net.Sockets.TcpClient($ip, 3389) } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $tcp) { throw "Remote Desktop is not reachable on ${ip}:3389" }
          try {
            .\dist\windows\install.ps1 -RelayUrl http://127.0.0.1:8080 -LauncherOut "$env:RUNNER_TEMP\unused.html"
            throw 'The installer did not refuse.'
          } catch {
            if ($_.Exception.Message -notmatch 'in use from the network') { throw }
            Write-Host "Refused as expected: $($_.Exception.Message)"
          } finally {
            $tcp.Dispose()
          }
          if (Get-NetFirewallRule -Name 'WRHS-*' -ErrorAction SilentlyContinue) { throw 'It changed the firewall anyway.' }
          if (Test-Path 'C:\ProgramData\WRHS') { throw 'It started installing anyway.' }
      - name: Install the agent service
        shell: powershell
        env:
          WRHS_PASSWORD: ci-wrhs-password-not-secret
        run: .\dist\windows\install.ps1 -RelayUrl http://127.0.0.1:8080 -User alice -RemoteDesktopUser wrhsrdp -LauncherOut "$env:RUNNER_TEMP\launcher.html"
      - name: Diagnose the service (only if installing failed)
        if: failure()
        shell: powershell
        run: |
          Write-Host '--- ACLs'
          & icacls.exe (Split-Path (Get-Command node.exe).Source)
          & icacls.exe C:\ProgramData\WRHS\logs
          & icacls.exe "C:\Program Files\WRHS"
          Write-Host '--- WinSW as the current user (console mode, 5 s)'
          $p = Start-Process -FilePath 'C:\Program Files\WRHS\wrhs-agent-service.exe' -ArgumentList 'test' -PassThru -NoNewWindow
          Start-Sleep -Seconds 5
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host '--- Same service as LocalSystem'
          & sc.exe config WRHSAgent obj= LocalSystem
          Start-Service WRHSAgent -ErrorAction Continue
          Start-Sleep -Seconds 5
          Get-Service WRHSAgent | Format-List Name, Status | Out-String | Write-Host
          Get-ChildItem C:\ProgramData\WRHS\logs | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 30 }
          Stop-Service WRHSAgent -ErrorAction SilentlyContinue
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Open This PC from Chromium through a relay
        env:
          WRHS_LAUNCHER: ${{ runner.temp }}\launcher.html
          WRHS_CONFIG: C:\ProgramData\WRHS\agent.json
          WRHS_USER: alice
          WRHS_PASSWORD: ci-wrhs-password-not-secret
          RDP_USER: wrhsrdp
          SCREENSHOT_DIR: ${{ runner.temp }}
        run: node test/windows/rdp-integration.ts
      - name: Re-running the installer switches Remote Desktop from the network on and off, and remembers it
        shell: powershell
        run: |
          function Assert-NetworkRdp([string]$Expected, [string]$When) {
            $blocked = [bool](Get-NetFirewallRule -Name 'WRHS-Block-RDP-TCP' -ErrorAction SilentlyContinue)
            $open = @(Get-NetFirewallRule -Group '@FirewallAPI.dll,-28752' | Where-Object { $_.Enabled -eq 'True' }).Count -gt 0
            $actual = if ($blocked -and -not $open) { 'block' } elseif ($open -and -not $blocked) { 'allow' } else { "blocked=$blocked, Windows rules on=$open" }
            if ($actual -ne $Expected) { throw "${When}: expected $Expected, got $actual" }
            if ((Get-Service WRHSAgent).Status -ne 'Running') { throw "${When}: the service is not running" }
            Write-Host "${When}: $actual"
          }
          $out = "$env:RUNNER_TEMP\launcher-again.html"
          Assert-NetworkRdp block 'after the first installation'
          .\dist\windows\install.ps1 -AllowNetworkRdp -LauncherOut $out
          Assert-NetworkRdp allow 'with -AllowNetworkRdp'
          .\dist\windows\install.ps1 -LauncherOut $out
          Assert-NetworkRdp allow 'after an upgrade'
          .\dist\windows\install.ps1 -BlockNetworkRdp -LauncherOut $out
          Assert-NetworkRdp block 'with -BlockNetworkRdp'
      - name: Collect logs
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\logs" | Out-Null
          Copy-Item -ErrorAction SilentlyContinue C:\ProgramData\WRHS\logs\* "$env:RUNNER_TEMP\logs"
          Copy-Item -ErrorAction SilentlyContinue "$env:RUNNER_TEMP\*.png" "$env:RUNNER_TEMP\logs"
          Get-ChildItem "$env:RUNNER_TEMP\logs" | ForEach-Object { Write-Host "--- $($_.Name)"; if ($_.Extension -eq '.log') { Get-Content $_.FullName -Tail 40 } }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-rdp
          path: ${{ runner.temp }}/logs
      - name: Uninstall the agent service
        shell: powershell
        run: |
          .\dist\windows\uninstall.ps1 -RemoveData
          if (Get-Service -Name WRHSAgent -ErrorAction SilentlyContinue) { throw 'The service is still installed.' }
          if (Get-NetFirewallRule -Name 'WRHS-*' -ErrorAction SilentlyContinue) { throw 'Firewall rules are left behind.' }

  # deploy/relay/install.sh on a real Ubuntu VM: relay as a systemd service
  # behind Caddy, an agent connecting through it, upgrade, Cloudflare mode's
  # package install, and uninstall.
  relay-native:
    name: relay (native install on Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the relay behind Caddy
        run: |
          # As on a server with the distribution's older Node.js: the installer
          # must bring in Node.js 22 from NodeSource.
          sudo mv /usr/local/bin/node /usr/local/bin/node.runner
          sudo apt-get update -qq && sudo apt-get install -y -qq nodejs
          /usr/bin/node --version
          sudo deploy/relay/install.sh --domain localhost
          grep -qx 'ExecStart=/usr/bin/node /opt/wrhs-relay/packages/relay/src/main.ts' /etc/systemd/system/wrhs-relay.service
          /usr/bin/node --version | grep '^v22\.'
      - name: The relay answers through Caddy, as its own user
        run: |
          systemctl is-active wrhs-relay caddy
          test "$(systemctl show wrhs-relay -p User --value)" = wrhs-relay
          sudo cat /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt > "$RUNNER_TEMP/caddy-root.crt"
          curl -fsS --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/healthz
          # Only the reverse proxy is reachable from outside.
          ss -ltnp | grep -E '127\.0\.0\.1:8080'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: An agent registers and connects through Caddy
        run: |
          D="$RUNNER_TEMP/agent"; mkdir -p "$D"
          node dist/agent/wrhs-agent.mjs init --relay https://localhost --this-pc --config "$D/agent.json"
          sudo deploy/relay/install.sh add-agent "$(node dist/agent/wrhs-agent.mjs registration --config "$D/agent.json")"
          NODE_EXTRA_CA_CERTS="$RUNNER_TEMP/caddy-root.crt" node dist/agent/wrhs-agent.mjs run --config "$D/agent.json" > "$D/agent.log" 2>&1 &
          for i in $(seq 1 30); do grep -q relay-connected "$D/agent.log" && break; sleep 1; done
          cat "$D/agent.log"
          grep -q relay-connected "$D/agent.log"
          sudo journalctl -u wrhs-relay --no-pager | grep agent-online
      - name: Running it again upgrades and keeps agents and settings
        run: |
          sudo deploy/relay/install.sh
          test "$(sudo deploy/relay/install.sh list-agents | wc -l)" = 1
          sudo deploy/relay/install.sh status
          curl -fsS --cacert "$RUNNER_TEMP/caddy-root.crt" https://localhost/healthz
      - name: Cloudflare mode installs cloudflared
        run: |
          sudo deploy/relay/install.sh --tls cloudflare --domain relay.example.invalid
          cloudflared --version
      - name: Uninstall removes everything
        run: |
          sudo deploy/relay/install.sh uninstall --purge
          test ! -e /etc/systemd/system/wrhs-relay.service
          test ! -e /opt/wrhs-relay && test ! -e /etc/wrhs-relay && test ! -e /etc/caddy/wrhs-relay.caddy
          ! id wrhs-relay
